<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modifier une page · Grand Rang</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/admin-extra.css"></head><body class="admin"><main><a class="admin-back" href="/admin.html">← Toutes les pages</a><p class="eyebrow">GRAND RANG · ADMINISTRATION</p><h1 id="editor-heading">Créer une page</h1><form id="page-form" hidden><label>Nom de la page dans le menu<input name="menu_label" required placeholder="Ex. Nos chevaux"></label><label>Adresse de la page<input name="slug" required placeholder="ex. nos-chevaux" pattern="[a-z0-9-]{2,60}"><small>Uniquement des minuscules, chiffres et tirets.</small></label><label>Petite accroche<input name="eyebrow"></label><label>Grand titre<textarea name="title" required></textarea></label><label>Introduction<textarea name="introduction"></textarea></label><label>Contenu de la page<textarea name="body"></textarea></label><label>Image de couverture<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" alt="Aperçu de l’image" hidden><label><input name="show_on_site" type="checkbox" checked> Publier cette page sur le site</label><button>Enregistrer la page</button><output></output></form><form id="login"><label>Mot de passe<input required type="password" name="password"></label><button>Ouvrir l’éditeur</button><output></output></form></main><script src="/admin-page.js"></script></body></html>
